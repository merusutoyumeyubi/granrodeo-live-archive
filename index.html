<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17151d">
<title>GRANRODEO | LIVE Archive</title>
<style>
:root{color-scheme:dark;--bg:#111015;--panel:#1b1922;--panel2:#24212d;--line:#393542;--text:#f5f1f8;--muted:#b5adbf;--accent:#e8b86d;--accent2:#f5dcae}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#3a2635 0,transparent 42%),var(--bg);color:var(--text);font-family:Inter,"Noto Sans TC","Noto Sans JP",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:1120px;margin:auto;padding:32px 22px 64px}header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:28px}
.eyebrow{color:var(--accent);letter-spacing:.22em;font-size:.72rem;font-weight:800}h1{margin:6px 0 0;font-size:clamp(2rem,5vw,3.5rem);letter-spacing:.04em;line-height:1.08}.sub{color:var(--muted);margin:12px 0 0}.count{border:1px solid var(--line);color:var(--muted);padding:9px 13px;border-radius:999px;white-space:nowrap;font-size:.85rem}
.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}.panel{background:rgba(27,25,34,.92);border:1px solid var(--line);border-radius:18px;overflow:hidden}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:1rem;letter-spacing:.08em}.panel-head p{margin:5px 0 0;color:var(--muted);font-size:.83rem}.event-list{padding:10px}
.event-button{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;color:inherit;border-radius:12px;padding:14px;cursor:pointer;font:inherit}.event-button:hover{background:var(--panel2)}.event-button.active{border-color:#80633e;background:linear-gradient(120deg,#332a29,#24212d)}.event-date{color:var(--accent);font-size:.8rem;font-weight:800;letter-spacing:.06em}.event-name{display:block;font-weight:750;line-height:1.4;margin:5px 0 8px}.event-venue{display:block;color:var(--muted);font-size:.82rem}
.detail{padding:clamp(20px,4vw,36px)}.detail-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.date-big{color:var(--accent);font-size:.9rem;font-weight:800;letter-spacing:.13em}h2#event-title{font-size:clamp(1.55rem,3vw,2.4rem);line-height:1.25;margin:10px 0 18px;overflow-wrap:anywhere}.type-tag{display:inline-flex;border:1px solid #79613f;color:var(--accent2);background:#2b251f;border-radius:999px;padding:5px 10px;font-size:.78rem;white-space:nowrap}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:24px 0 32px}.meta-item{padding:13px 15px;background:var(--panel2);border-radius:12px;min-width:0}.meta-label{display:block;color:var(--muted);font-size:.75rem;margin-bottom:4px}.meta-value{font-weight:650;overflow-wrap:anywhere}
.setlist-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:4px}.setlist-heading h3{margin:0;font-size:1.15rem;letter-spacing:.12em}.setlist-heading span{color:var(--muted);font-size:.82rem}.track{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid rgba(57,53,66,.72)}.track-no{color:var(--accent);font-variant-numeric:tabular-nums;font-size:.9rem;font-weight:800}.track-name{font-weight:650;overflow-wrap:anywhere}.empty{color:var(--muted);padding:24px 0}footer{color:var(--muted);font-size:.78rem;margin-top:22px;text-align:center}.notice{color:var(--muted);background:#201e26;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:22px;font-size:.8rem}
@media(max-width:760px){.wrap{padding:22px 14px 42px}header{align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}.event-list{display:grid;grid-template-columns:1fr 1fr;gap:4px}.meta{grid-template-columns:1fr}.count{align-self:flex-start}}@media(max-width:430px){.event-list{grid-template-columns:1fr}.track{grid-template-columns:34px minmax(0,1fr)}.type-tag{font-size:.7rem}}
</style>
</head>
<body><main class="wrap">
<header><div><div class="eyebrow">GRANRODEO · LIVE ARCHIVE</div><h1>LIVE DETAIL</h1><p class="sub">場次資料與 Setlist 試作版</p></div><div class="count" id="event-count">2 場試作資料</div></header>
<div class="layout"><section class="panel" aria-label="LIVE 場次列表"><div class="panel-head"><h2>LIVE LIST</h2><p>選擇場次查看詳細資訊</p></div><div class="event-list" id="event-list"></div></section><section class="panel" aria-live="polite"><div class="detail" id="event-detail"></div></section></div>
<footer>試作版 · 資料取自使用者提供的 CSV · 類型未填寫時會標示「待補」</footer></main>
<script>
const events = [
{eventId:"TS2026112301",date:"2026/11/23",name:"GRANRODEO Acoustic Live 2026 PLUGLESS GR -FIRE HORSE-",venue:"J:COMホール八王子(八王子市民会館)",type:"",setlist:[{order:"1",songName:"Go For It!"},{order:"2",songName:"Infinte Love"},{order:"3",songName:"DECADENCE"},{order:"4",songName:"慟哭ノ雨"}]},
{eventId:"TS2026112001",date:"2026/11/20",name:"東武鉄道 presents ANIMAX MUSIX 2026 supported by Lemino【DAY1】",venue:"横浜アリーナ",type:"",setlist:[{order:"1",songName:"HEAVEN"},{order:"2",songName:"delight song"},{order:"3",songName:"NOT for SALE"},{order:"4",songName:"GAMBiT"}]}
];
const $=id=>document.getElementById(id);
const esc=value=>String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
let selectedId="";
function renderList(){ $("event-list").innerHTML=events.map(event=>'<button class="event-button '+(event.eventId===selectedId?"active":"")+'" data-id="'+esc(event.eventId)+'"><span class="event-date">'+esc(event.date)+'</span><span class="event-name">'+esc(event.name)+'</span><span class="event-venue">⌖ '+esc(event.venue)+'</span></button>').join("");$("event-list").querySelectorAll("button[data-id]").forEach(button=>button.addEventListener("click",()=>selectEvent(button.dataset.id))); }
function selectEvent(id){selectedId=id;const event=events.find(item=>item.eventId===id);if(!event)return;renderList();const tracks=event.setlist;const trackHTML=tracks.length?tracks.map(track=>'<div class="track"><div class="track-no">'+esc(String(track.order).padStart(2,"0"))+'</div><div class="track-name">'+esc(track.songName)+'</div></div>').join(""):'<p class="empty">目前沒有歌單資料。</p>';$("event-detail").innerHTML='<div class="detail-top"><div><div class="date-big">'+esc(event.date)+'</div><h2 id="event-title">'+esc(event.name)+'</h2></div><span class="type-tag">'+esc(event.type||"類型待補")+'</span></div><div class="meta"><div class="meta-item"><span class="meta-label">DATE</span><span class="meta-value">'+esc(event.date)+'</span></div><div class="meta-item"><span class="meta-label">VENUE</span><span class="meta-value">'+esc(event.venue)+'</span></div><div class="meta-item"><span class="meta-label">TYPE</span><span class="meta-value">'+esc(event.type||"類型待補")+'</span></div><div class="meta-item"><span class="meta-label">EVENT ID</span><span class="meta-value">'+esc(event.eventId)+'</span></div></div><div class="setlist-heading"><h3>SETLIST</h3><span>'+tracks.length+' TRACKS</span></div>'+trackHTML+'<div class="notice">此頁目前只呈現已匯入的資料。空白欄位會標示為待補，不會自行推測。</div>';}
selectEvent(events[0].eventId);
</script></body></html>
